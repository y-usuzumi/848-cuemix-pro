<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title description">
  <title id="title">Clean redraw of one CueMix-style microphone input strip</title>
  <desc id="description">An editable Mic slash Inst 1 label, a vertical gain fader, a vertical signal meter with decibel marks, and three latching two-state controls for 48 volt phantom power, pad, and polarity.</desc>
  <defs>
    <linearGradient id="meterFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#248957"/>
      <stop offset="0.72" stop-color="#49aa68"/>
      <stop offset="0.9" stop-color="#dfb43d"/>
      <stop offset="1" stop-color="#d75b50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#233126" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #677369; }
      .label { fill: #26352b; font-size: 16px; font-weight: 650; }
      .small { fill: #677369; font-size: 12px; }
      .mark { fill: #566359; font-size: 12px; }
      .callout { fill: #425147; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="720" height="960" fill="#f4f7f2"/>
  <g class="ui">
    <rect x="42" y="34" width="416" height="890" rx="18" fill="#ffffff" stroke="#ccd5ca" filter="url(#shadow)"/>

    <!-- Click-to-edit channel name -->
    <text x="76" y="88" class="label" font-size="23">Mic / Inst 1</text>
    <path d="M76 99H222" stroke="#8aa491" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g transform="translate(232 70)" stroke="#607668" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M2 17l3.4-9.8L12.7 0l5.1 5.1-7.2 7.3L2 17z"/>
      <path d="M5.4 7.2l5.2 5.2"/>
    </g>
    <text x="76" y="124" class="small">Click the label to rename this channel</text>
    <line x1="70" y1="150" x2="430" y2="150" stroke="#e0e6de"/>

    <!-- Gain section -->
    <text x="84" y="198" class="muted" font-size="13" font-weight="700" letter-spacing="1.1">GAIN</text>
    <text x="83" y="232" fill="#238552" font-size="25" font-weight="700">30 dB</text>
    <rect x="125" y="270" width="8" height="390" rx="4" fill="#dce3da"/>
    <rect x="126.5" y="270" width="5" height="220" rx="2.5" fill="#8ba898"/>
    <g stroke="#b2beb3" stroke-width="1">
      <line x1="112" y1="270" x2="125" y2="270"/>
      <line x1="116" y1="348" x2="125" y2="348"/>
      <line x1="112" y1="426" x2="125" y2="426"/>
      <line x1="116" y1="504" x2="125" y2="504"/>
      <line x1="112" y1="582" x2="125" y2="582"/>
      <line x1="116" y1="660" x2="125" y2="660"/>
    </g>
    <rect x="99" y="466" width="60" height="48" rx="12" fill="#ffffff" stroke="#496052" stroke-width="2.5" filter="url(#shadow)"/>
    <line x1="110" y1="490" x2="148" y2="490" stroke="#8ba195" stroke-width="2" stroke-linecap="round"/>

    <!-- Level meter and scale -->
    <text x="248" y="198" class="muted" font-size="13" font-weight="700" letter-spacing="1.1">LEVEL</text>
    <rect x="252" y="270" width="22" height="390" rx="6" fill="#dce3da"/>
    <rect x="252" y="414" width="22" height="246" rx="6" fill="url(#meterFill)"/>
    <rect x="256" y="418" width="4" height="238" rx="2" fill="#ffffff" opacity="0.22"/>

    <g class="mono mark">
      <g><line x1="280" y1="270" x2="291" y2="270" stroke="#91a096"/><text x="300" y="274">clip</text></g>
      <g><line x1="280" y1="326" x2="291" y2="326" stroke="#91a096"/><text x="300" y="330">−3</text></g>
      <g><line x1="280" y1="382" x2="291" y2="382" stroke="#91a096"/><text x="300" y="386">−6</text></g>
      <g><line x1="280" y1="438" x2="291" y2="438" stroke="#91a096"/><text x="300" y="442">−12</text></g>
      <g><line x1="280" y1="494" x2="291" y2="494" stroke="#91a096"/><text x="300" y="498">−24</text></g>
      <g><line x1="280" y1="550" x2="291" y2="550" stroke="#91a096"/><text x="300" y="554">−36</text></g>
      <g><line x1="280" y1="606" x2="291" y2="606" stroke="#91a096"/><text x="300" y="610">−48</text></g>
      <g><line x1="280" y1="660" x2="291" y2="660" stroke="#91a096"/><text x="300" y="664">−∞</text></g>
    </g>

    <!-- Three independent latching toggle buttons -->
    <line x1="70" y1="706" x2="430" y2="706" stroke="#e0e6de"/>
    <text x="76" y="744" class="muted" font-size="13" font-weight="700" letter-spacing="1.1">CHANNEL SWITCHES</text>

    <g transform="translate(76 768)">
      <rect width="104" height="92" rx="12" fill="#e9f4ec" stroke="#278a56" stroke-width="2"/>
      <circle cx="84" cy="18" r="5" fill="#278a56"/>
      <text x="52" y="48" text-anchor="middle" fill="#226e47" font-size="20" font-weight="750">48 V</text>
      <text x="52" y="72" text-anchor="middle" fill="#278a56" font-size="11" font-weight="700" letter-spacing="1">ON</text>
    </g>
    <g transform="translate(198 768)">
      <rect width="104" height="92" rx="12" fill="#f7f8f6" stroke="#b9c3b9" stroke-width="2"/>
      <circle cx="84" cy="18" r="5" fill="#c3cbc3"/>
      <text x="52" y="48" text-anchor="middle" fill="#455349" font-size="18" font-weight="750">PAD</text>
      <text x="52" y="72" text-anchor="middle" fill="#7a867d" font-size="11" font-weight="700" letter-spacing="1">OFF</text>
    </g>
    <g transform="translate(320 768)">
      <rect width="104" height="92" rx="12" fill="#f7f8f6" stroke="#b9c3b9" stroke-width="2"/>
      <circle cx="84" cy="18" r="5" fill="#c3cbc3"/>
      <text x="52" y="51" text-anchor="middle" fill="#455349" font-size="27" font-weight="650">Ø</text>
      <text x="52" y="72" text-anchor="middle" fill="#7a867d" font-size="11" font-weight="700" letter-spacing="1">OFF</text>
    </g>

    <!-- Explanatory callouts -->
    <g fill="none" stroke="#7a9281" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 84H492l-9-6m9 6l-9 6"/>
      <path d="M340 466H492l-9-6m9 6l-9 6"/>
      <path d="M424 814H492l-9-6m9 6l-9 6"/>
    </g>
    <text x="508" y="80" class="callout">Editable label</text>
    <text x="508" y="100" class="small">Click the name itself</text>
    <text x="508" y="462" class="callout">Live vertical meter</text>
    <text x="508" y="482" class="small">Bottom to top: −∞ → clip</text>
    <text x="508" y="810" class="callout">Three two-state flips</text>
    <text x="508" y="830" class="small">Each latches on or off</text>
    <text x="508" y="850" class="small">48 V · Pad · Polarity</text>
  </g>
</svg>
